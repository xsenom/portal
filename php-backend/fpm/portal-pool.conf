[portal]

user = portalphp
group = portalphp

listen = 127.0.0.1:5082
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

chdir = /opt/portal/php-backend/public

clear_env = yes

env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD] = $DB_PASSWORD

env[ADMIN_LOGIN] = $ADMIN_LOGIN
env[ADMIN_EMAIL] = $ADMIN_EMAIL
env[ADMIN_PASSWORD] = $ADMIN_PASSWORD

env[COOKIE_SECURE] = true

catch_workers_output = yes
decorate_workers_output = no

access.log = /opt/portal/php-backend/storage/php-fpm-access.log
slowlog = /opt/portal/php-backend/storage/php-fpm-slow.log
request_slowlog_timeout = 10s
request_terminate_timeout = 120s

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /opt/portal/php-backend/storage/php-fpm-error.log
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
